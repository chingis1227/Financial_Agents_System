[
  {
    "id": "non_ic_no_final_action",
    "scope": "non_ic_outputs",
    "forbidden_patterns": [
      "IC Action: Buy",
      "IC Action: Sell",
      "IC Action: Hold",
      "IC Action: Add",
      "IC Action: Trim",
      "IC Action: Exit",
      "Action Box",
      "Buy recommendation",
      "Sell recommendation",
      "Hold recommendation"
    ]
  },
  {
    "id": "agent_requires_spawn_or_blocked",
    "scope": "AGENT",
    "rule": "agent_workflow_claim_valid_only_with_spawned_agents_else_limited_audit_fallback"
  },
  {
    "id": "agent_workflow_requires_actual_spawn",
    "scope": "execution_mode",
    "rule": "spawned_subagent_workflow_valid_only_with_spawned_agents"
  },
  {
    "id": "freshness_requires_timestamp_or_limited",
    "scope": "freshness",
    "rule": "freshness_prompts_require_timestamped_sources_or_limited_blocked"
  },
  {
    "id": "missing_context_not_hard_avoid",
    "scope": "ic_action",
    "rule": "missing_information_alone_is_defer_not_hard_avoid"
  },
  {
    "id": "quick_take_no_final_action_escape_hatch",
    "scope": "QUICK",
    "rule": "quick_take_never_issues_final_ic_action_even_if_gates_pass",
    "forbidden_patterns": [
      "No final IC Action unless",
      "IC Action Status: Limited or Blocked unless",
      "Quick Take unless all gates pass",
      "Quick Take unless required gates pass"
    ]
  },
  {
    "id": "russian_report_language_style_gate",
    "scope": "Russian user-facing investment output",
    "rule": "Russian investment reports must pass language-policy and investment-analytical-style validation before sending or saving",
    "validator": "tools\\validate_language_style.py",
    "forbidden_patterns": [
      "growth exposure",
      "headline earnings",
      "profit pools",
      "customer wins",
      "customer-level exposure",
      "downside-модель",
      "English-Russian hybrid"
    ]
  }
]
